name: Publicar Cucumberlist
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Instalar renderizador de retratos
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Actualizar perfiles, iconos y copias públicas
        run: python3 scripts/actualizar-datos.py
      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - name: Subir sitio preparado
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
