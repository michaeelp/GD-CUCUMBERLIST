<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Demons - Compartida</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1a;
    --card:#111827;
    --text:#e5e7eb;
    --sub:#9ca3af;
    --line:#2b2f3a;
    --green:#34d399;
    --blue:#60a5fa;
    --pink:#f472b6;
    --orange:#f59e0b;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Poppins',sans-serif;
    background: radial-gradient(circle at 20% 0%, #1f2a5a, var(--bg));
    color:var(--text);
  }

  .container{
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  .header h1{
    font-size: 28px;
    letter-spacing: 0.5px;
  }

  .header p{
    color:var(--sub);
  }

  .grid{
    display:grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 20px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  .card h2{
    margin-bottom: 15px;
    font-size: 18px;
  }

  .form{
    display:flex;
    gap: 10px;
    align-items:center;
    flex-wrap: wrap;
  }

  .form select, .form input{
    padding: 12px 14px;
    border-radius: 12px;
    border:1px solid var(--line);
    background: #0f172a;
    color:var(--text);
    outline:none;
    flex: 1;
  }

  .form button{
    padding: 12px 16px;
    border:none;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--blue), var(--pink));
    color:white;
    font-weight:700;
    cursor:pointer;
    transition: transform .2s ease;
  }

  .form button:hover{ transform: translateY(-2px); }

  table{
    width:100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  th, td{
    padding: 10px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
    font-size: 14px;
  }

  th{
    color: var(--sub);
    font-weight: 600;
  }

  .tick{
    display:inline-block;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: var(--green);
    margin-right: 6px;
  }

  .player{
    display:flex;
    align-items:center;
    gap: 8px;
    font-weight:700;
  }

  .score-list{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .player-card{
    padding: 14px;
    border-radius: 16px;
    border:1px solid var(--line);
    background: linear-gradient(135deg, #0f172a, #111827);
    cursor:pointer;
    transition: transform .2s ease, border-color .2s ease;
  }

  .player-card:hover{
    transform: translateY(-3px);
    border-color: var(--blue);
  }

  .player-card .name{
    font-weight: 700;
    margin-bottom: 6px;
  }

  .player-card .score{
    color: var(--sub);
    font-size: 14px;
  }

  .details{
    margin-top: 15px;
    border-top: 1px solid var(--line);
    padding-top: 15px;
  }

  .details h3{
    font-size: 16px;
    margin-bottom: 10px;
  }

  .details ul{
    list-style:none;
    padding-left:0;
  }

  .details li{
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .small{
    color: var(--sub);
    font-size: 12px;
  }

  @media (max-width: 900px){
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Lista de Demons (Compartida)</h1>
      <p>Thiaguinhio / Michaeelp / Nzrv — todo en tiempo real</p>
    </div>
  </div>

  <div class="grid">
    <!-- LISTA -->
    <div class="card">
      <h2>Lista de demons pasados</h2>

      <div class="form">
        <select id="playerSelect">
          <option value="thiaguinhio">thiaguinhio</option>
          <option value="michaeelp">michaeelp</option>
          <option value="nzrv">nzrv</option>
        </select>

        <input id="demonInput" placeholder="Escribí el demon (solo sugerencias reales)" list="demonList" autocomplete="off">
        <datalist id="demonList"></datalist>

        <button id="submitBtn">Submit</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Tier</th>
            <th>Demon</th>
            <th>thiaguinhio</th>
            <th>michaeelp</th>
            <th>nzrv</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- se llena con JS -->
        </tbody>
      </table>

      <div class="small">Nota: la lista empieza vacía y se llena en tiempo real.</div>
    </div>

    <!-- PUNTAJES -->
    <div class="card">
      <h2>Puntajes</h2>

      <div class="score-list" id="scoreList">
        <!-- se llena con JS -->
      </div>

      <div class="details" id="detailsSection" style="display:none;">
        <h3 id="detailsTitle"></h3>
        <ul id="detailsList"></ul>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  // ====== CONFIG DE FIREBASE (CAMBIÁ ESTO) ======
  const firebaseConfig = { 
    apiKey: "AIzaSyBfw2hIsXKxU3z7d11pa2uPVFPfRQcyQe4", 
    authDomain: "gd-cucumberlist.firebaseapp.com", 
    databaseURL: "https://gd-cucumberlist-default-rtdb.firebaseio.com", 
    projectId: "gd-cucumberlist", 
    storageBucket: "gd-cucumberlist.firebasestorage.app", 
    messagingSenderId: "243319547284", 
    appId: "1:243319547284:web:d6100b0f2177b3ebab5b81", 
    measurementId: "G-JTG59VBS4W" 
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ====== VARIABLES ======
  const playerSelect = document.getElementById("playerSelect");
  const demonInput = document.getElementById("demonInput");
  const demonList = document.getElementById("demonList");
  const submitBtn = document.getElementById("submitBtn");
  const tableBody = document.getElementById("tableBody");
  const scoreList = document.getElementById("scoreList");
  const detailsSection = document.getElementById("detailsSection");
  const detailsTitle = document.getElementById("detailsTitle");
  const detailsList = document.getElementById("detailsList");

  const players = ["thiaguinhio", "michaeelp", "nzrv"];
  let demons = [];

  // ====== TRAER DEMONS DESDE GOOGLE SHEETS ======
async function loadSpreadsheet() {
  const url = "https://docs.google.com/spreadsheets/d/1xaMERl70vzr8q9MqElr4YethnV15EOe8oL1UV9LLljc/gviz/tq?tqx=out:json&gid=1142185972";
  const res = await fetch(url);
  const text = await res.text();

  // google devuelve basura antes del JSON, hay que limpiarlo
  const json = JSON.parse(text.substring(47).slice(0, -2));

  demons = json.table.rows.map(row => ({
    name: row.c[0]?.v || "",              // Name
    difficulty: row.c[1]?.v || "",        // Official Difficulty
    tier: Number(row.c[2]?.v) || 0         // Tier (ranking)
  }));

  // ordenar por tier DESC (más tier = más arriba)
  demons.sort((a, b) => b.tier - a.tier);

  demonList.innerHTML = "";
  demons.forEach(d => {
    const opt = document.createElement("option");
    opt.value = `${d.tier} — ${d.name}`;
    demonList.appendChild(opt);
  });
  }

  // ====== ESCUCHAR DB EN TIEMPO REAL ======
  function listenDB() {
    db.ref("pasados").on("value", snapshot => {
      const data = snapshot.val() || {};
      renderTable(data);
      renderScores(data);
    });
  }

  // ====== RENDER TABLA ======
  function renderTable(data) {
    const arr = Object.values(data);

    // ordenar por posición
    arr.sort((a, b) => b.tier - a.tier);

    tableBody.innerHTML = "";

    arr.forEach(item => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${item.tier}</td>
        <td>${item.name}</td>
        <td>${item.thiaguinhio ? "✓" : ""}</td>
        <td>${item.michaeelp ? "✓" : ""}</td>
        <td>${item.nzrv ? "✓" : ""}</td>
      `;

      tableBody.appendChild(row);
    });
  }

  // ====== PUNTOS ======
  function calcScore(tier) {
  return tier * 10;
  }


  function renderScores(data) {
    const arr = Object.values(data);
    const scoreObj = { thiaguinhio:0, michaeelp:0, nzrv:0 };

    arr.forEach(d => {
      players.forEach(p => {
        if (d[p]) scoreObj[p] += calcScore(d.tier);
      });
    });

    // ordenar por puntaje
    const sorted = players.sort((a,b)=> scoreObj[b]-scoreObj[a]);

    scoreList.innerHTML = "";
    sorted.forEach(p => {
      const card = document.createElement("div");
      card.className = "player-card";
      card.innerHTML = `
        <div class="name">${p}</div>
        <div class="score">${scoreObj[p]} pts</div>
      `;

      card.addEventListener("click", () => showDetails(p, arr));
      scoreList.appendChild(card);
    });
  }

  function showDetails(player, arr) {
    detailsSection.style.display = "block";
    detailsTitle.innerText = `Demons pasados por ${player}`;

    const list = arr
      .filter(d => d[player])
      .sort((a,b) => a.position - b.position);

    detailsList.innerHTML = "";
    list.forEach(d => {
      const li = document.createElement("li");
      li.innerText = `#${d.position} — ${d.name}`;
      detailsList.appendChild(li);
    });
  }

  // ====== SUBMIT ======
  submitBtn.addEventListener("click", async () => {
    const player = playerSelect.value;
    const demonText = demonInput.value;

    // validar demon
    const found = demons.find(d => `${d.tier} — ${d.name}` === demonText);
    if (!found) {
      alert("Tenés que elegir un demon real de la lista (no podés escribir lo que quieras).");
      return;
    }

    // revisar si ya existe en DB
    const snapshot = await db.ref("pasados").orderByChild("position").equalTo(found.position).once("value");
    const exists = snapshot.exists();

    if (exists) {
      // actualizar el demon existente
      const key = Object.keys(snapshot.val())[0];
      const obj = snapshot.val()[key];
      obj[player] = true;
      await db.ref("pasados/" + key).set(obj);
    } else {
      // crear nuevo demon
      await db.ref("pasados").push({
        tier: found.tier,
        name: found.name,
        difficulty: found.difficulty,
        thiaguinhio: player === "thiaguinhio",
        michaeelp: player === "michaeelp",
        nzrv: player === "nzrv"
      });
    }

    demonInput.value = "";
  });

  // ====== START ======
  loadSpreadsheet();
  listenDB();
</script>
</body>

</html>
