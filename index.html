<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Cucumberlist</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Geometry Dash palette */
    --yellow:#ffd400;
    --cyan:#4fd1ff;
    --green:#3cff8f;

    --bg:#070b14;
    --card:#0f1629;
    --text:#e5e7eb;
    --sub:#9ca3af;
    --line:#1f2a44;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
  }

  body{
    font-family:'Poppins',sans-serif;
    background:
      linear-gradient(135deg, rgba(255,212,0,0.05), rgba(79,209,255,0.05), rgba(60,255,143,0.05)),
      var(--bg);
    color:var(--text);
  }

  tbody tr:hover{
  background: rgba(255,255,255,0.04);
  }

  .container{
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:30px;
  }

  .header{
    margin-bottom:20px;
  }

  .header h1{
    font-size:30px;
    letter-spacing:1px;
    text-shadow:
  0 0 10px rgba(255,212,0,0.35),
  0 0 20px rgba(79,209,255,0.15);
  }

  .header p{
    color:var(--sub);
  }

  .grid{
    flex:1;
    display:grid;
    grid-template-columns: 1.3fr 0.7fr;
    gap:20px;
  }

  .card{
    background:var(--card);
    border:2px solid var(--line);
    clip-path: polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    padding:20px;
    display:flex;
    flex-direction:column;
  }

  .card h2{
    margin-bottom:14px;
    font-size:18px;
  }

  .form{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    position:relative;
  }

  .form select, .form input{
    padding:12px 14px;
    border:2px solid var(--line);
    background:#0b1022;
    color:var(--text);
    outline:none;
    flex:1;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }

  .form button{
    padding:12px 18px;
    border:none;
    background:linear-gradient(90deg,var(--yellow),var(--cyan));
    color:#000;
    font-weight:700;
    cursor:pointer;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }

  .player-demon{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  }

  .player-demon span{
    margin-right:10px;
  }

  .remove-btn{
    background:transparent;
    border:1px solid var(--line);
    color:#ff6b6b;
    padding:4px 8px;
    cursor:pointer;
    font-size:12px;
  }

  .remove-btn:hover{
    background:rgba(255,0,0,0.1);
  }


  /* custom search results */
  .search-results{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    max-height:320px;
    overflow-y:auto;
    background:#0b1022;
    border:2px solid var(--line);
    z-index:10;
  }

  .search-item{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:14px;
  }

  .search-item:hover{
    background:rgba(255,255,255,0.05);
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:16px;
    font-size:14px;
  }

  th, td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
  }

  th{
    color:var(--sub);
    font-weight:600;
  }

  .tier{ color:var(--yellow); font-weight:700; }
  .rating{ color:var(--cyan); }
  .points{ color:var(--green); }

  .score-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .player-card{
    padding:14px;
    border:2px solid var(--line);
    background:#0b1022;
    cursor:pointer;
    clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }

  .player-card .name{ font-weight:700; }
  .player-card .score{ color:var(--sub); font-size:14px; }

  @media (max-width: 900px){
    .grid{ grid-template-columns:1fr; }
  }

  .rating-extreme{ color:#ff3b3b; font-weight:700; }
  .rating-insane{ color:#ff7b00; font-weight:700; }
  .rating-hard{ color:#ffb703; font-weight:700; }
  .rating-medium{ color:#4fd1ff; font-weight:700; }
  .rating-easy{ color:#3cff8f; font-weight:700; }

  .tier-35{ color:#ff3b3b; }
  .tier-30{ color:#ff7b00; }
  .tier-25{ color:#ffd400; }
  .tier-20{ color:#3cff8f; }
  .tier-15{ color:#4fd1ff; }
  .tier-10{ color:#6b8cff; }
  .tier-5{ color:#9ca3af; }
  .tier-0{ color:#6b7280; }
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>GD Cucumberlist</h1>
  </div>

  <div class="grid">
    <!-- LISTA -->
    <div class="card">
      <h2>Lista de demons pasados</h2>

      <div class="form">
        <select id="playerSelect">
          <option value="thiaguinhio">thiaguinhio</option>
          <option value="michaeelp">michaeelp</option>
          <option value="nzrv">nzrv</option>
        </select>

        <input id="demonInput" placeholder="Buscar demon…" autocomplete="off">
        <div class="search-results" id="searchResults" style="display:none;"></div>

        <button id="submitBtn">Submit</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Tier</th>
            <th>Demon</th>
            <th>Puntos</th>
            <th>Rating</th>
            <th>Completado</th>
            <th>Creador</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- PUNTAJES -->
    <div class="card">
      <h2>Puntajes</h2>
      <div class="score-list" id="scoreList"></div>
      <div id="playerDetails" style="margin-top:16px; display:none;">
      <h3 id="playerDetailsTitle" style="margin-bottom:10px;"></h3>
      <div id="playerDetailsList"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { 
    apiKey: "AIzaSyBfw2hIsXKxU3z7d11pa2uPVFPfRQcyQe4", 
    authDomain: "gd-cucumberlist.firebaseapp.com", 
    databaseURL: "https://gd-cucumberlist-default-rtdb.firebaseio.com", 
    projectId: "gd-cucumberlist", 
    storageBucket: "gd-cucumberlist.firebasestorage.app", 
    messagingSenderId: "243319547284", 
    appId: "1:243319547284:web:d6100b0f2177b3ebab5b81" 
  };

  let currentData = {};
  let selectedPlayer = null;

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const playerSelect = document.getElementById("playerSelect");
  const demonInput = document.getElementById("demonInput");
  const submitBtn = document.getElementById("submitBtn");
  const tableBody = document.getElementById("tableBody");
  const scoreList = document.getElementById("scoreList");
  const searchResults = document.getElementById("searchResults");

  const players = ["thiaguinhio", "michaeelp", "nzrv"];
  let demons = [];
  let selectedDemon = null;

  async function loadSpreadsheet() {
    const url = "https://docs.google.com/spreadsheets/d/1qKlWKpDkOpU1ZF6V6xGfutDY2NvcA8MNPnsv6GBkKPQ/gviz/tq?tqx=out:json&gid=0";
    const res = await fetch(url);
    const text = await res.text();
    const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/s)[1];
    const json = JSON.parse(jsonText);

    demons = json.table.rows
      .map(r => ({
        name: r.c[1]?.v,
        difficulty: r.c[4]?.v,
        tier: Math.floor(Number(r.c[5]?.v) * 10) / 10,
        creator: r.c[2]?.v
      }))
      .filter(d => d.name && !isNaN(d.tier))
      .sort((a,b) => b.tier - a.tier);
  }

  demonInput.addEventListener("input", () => {
    const q = demonInput.value.toLowerCase();
    searchResults.innerHTML = "";

    if (!q) {
      searchResults.style.display = "none";
      return;
    }

    demons.filter(d => d.name.toLowerCase().includes(q)).forEach(d => {
      const div = document.createElement("div");
      div.className = "search-item";
      div.innerText = `${d.tier.toFixed(1)} — ${d.name}`;
      div.onclick = () => {
        selectedDemon = d;
        demonInput.value = `${d.tier.toFixed(1)} — ${d.name}`;
        searchResults.style.display = "none";
      };
      searchResults.appendChild(div);
    });

    searchResults.style.display = "block";
  });

  function listenDB() {
    db.ref("pasados").on("value", snap => {
      currentData = snap.val() || {};
      renderTable(currentData);
      renderScores(currentData);

      if(selectedPlayer){
        renderPlayerDetails(selectedPlayer);
      }
    });
  }

  function getTierClass(tier){
    if(tier >= 35) return "tier-35";
    if(tier >= 30) return "tier-30";
    if(tier >= 25) return "tier-25";
    if(tier >= 20) return "tier-20";
    if(tier >= 15) return "tier-15";
    if(tier >= 10) return "tier-10";
    if(tier >= 5) return "tier-5";
    return "tier-0";
  }

  function getRatingClass(rating){
    if(!rating) return "";
    rating = rating.toLowerCase();
    if(rating.includes("extreme")) return "rating-extreme";
    if(rating.includes("insane")) return "rating-insane";
    if(rating.includes("hard")) return "rating-hard";
    if(rating.includes("medium")) return "rating-medium";
    if(rating.includes("easy")) return "rating-easy";
    return "";
  }

  function renderTable(data) {
    const arr = Object.values(data).sort((a,b)=>b.tier-a.tier);
    tableBody.innerHTML = "";

    arr.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="tier ${getTierClass(item.tier)}">${item.tier.toFixed(1)}</td>
        <td>${item.name}</td>
        <td class="points">${item.tier*10}</td>
        <td class="rating ${getRatingClass(item.difficulty)}">${item.difficulty}</td>
        <td>
          ${players.map(p => `
            <span style="margin-right:10px;color:${item[p] ? 'var(--green)' : '#555'}">
              ${item[p] ? '✓' : '○'} ${p}
            </span>
          `).join("")}
        </td>
        <td>${item.creator || "—"}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  function calcScore(tier){ return tier*10; }

  function renderScores(data){
    const scoreObj = { thiaguinhio:0, michaeelp:0, nzrv:0 };
    Object.values(data).forEach(d=>{
      players.forEach(p=>{ if(d[p]) scoreObj[p]+=calcScore(d.tier); });
    });

    scoreList.innerHTML = "";
    players.sort((a,b)=>scoreObj[b]-scoreObj[a]).forEach(p=>{
    const div = document.createElement("div");
    div.className = "player-card";
    div.innerHTML = `
      <div class="name">${p}</div>
      <div class="score">${scoreObj[p]} pts</div>
    `;

    div.onclick = () => showPlayerDetails(p);

    scoreList.appendChild(div);
    });
  }

  function renderPlayerDetails(player){
    const container = document.getElementById("playerDetails");
    const title = document.getElementById("playerDetailsTitle");
    const list = document.getElementById("playerDetailsList");
  
    title.innerText = `Demons pasados por ${player}`;
    list.innerHTML = "";
    container.style.display = "block";
  
    // ordenar por tier descendente
    const demons = Object.entries(currentData)
      .filter(([key, d]) => d[player])
      .sort((a,b) => b[1].tier - a[1].tier);
  
    demons.forEach(([key, d]) => {
      const div = document.createElement("div");
      div.className = "player-demon";
      div.innerHTML = `
        <div>
          <span class="tier ${getTierClass(d.tier)}">${d.tier.toFixed(1)}</span>
          <span>${d.name}</span>
          <span class="rating ${getRatingClass(d.difficulty)}">${d.difficulty}</span>
          <span style="margin-left:10px;color:var(--sub)">by ${d.creator || "—"}</span>
          <span class="points" style="margin-left:10px">+${calcScore(d.tier)} pts</span>
        </div>
        <button class="remove-btn">Quitar</button>
      `;
  
      div.querySelector(".remove-btn").onclick = () =>
        removeDemonFromPlayer(key, d, player);
  
      list.appendChild(div);
    });
  }

  function showPlayerDetails(player){
    selectedPlayer = player;
    renderPlayerDetails(player);
  }

  function removeDemonFromPlayer(key, demon, player){
    const updated = { ...demon };
    updated[player] = false;

    const stillCompleted = players.some(p => updated[p]);

    if(stillCompleted){
      db.ref("pasados/" + key).set(updated);
    } else {
      db.ref("pasados/" + key).remove();
    }
  }

  submitBtn.addEventListener("click", async () => {
  if (!selectedDemon) return alert("Seleccioná un demon de la lista");

  const player = playerSelect.value;

  // ID único por demonio (puede ser el nombre)
  const demonKey = selectedDemon.name.replace(/\s+/g, "_").toLowerCase();

  // verificar si ya está pasado por el jugador
  const snap = await db.ref("pasados/" + demonKey).get();
  const existing = snap.val();

  if (existing && existing[player]) {
    return alert("Ya pasaste ese nivel");
  }

  // si existe, lo actualizamos, si no, lo creamos
  const newData = {
    tier: selectedDemon.tier,
    name: selectedDemon.name,
    creator: selectedDemon.creator,
    difficulty: selectedDemon.difficulty,
    thiaguinhio: existing?.thiaguinhio || false,
    michaeelp: existing?.michaeelp || false,
    nzrv: existing?.nzrv || false,
  };

  newData[player] = true;

  await db.ref("pasados/" + demonKey).set(newData);

  demonInput.value = "";
  selectedDemon = null;
});

  async function autoCleanDuplicates() {
  const snap = await db.ref("pasados").get();
  const data = snap.val();

  if (!data) return;

  const keys = Object.keys(data);
  if (keys.length <= 1) return; // si hay 1 o 0 demonios, no hace nada

  const merged = {};

  for (const [key, item] of Object.entries(data)) {
    const demonKey = item.name.replace(/\s+/g, "_").toLowerCase();

    if (!merged[demonKey]) {
      merged[demonKey] = {
        tier: item.tier,
        name: item.name,
        creator: item.creator || "",
        difficulty: item.difficulty || "",
        thiaguinhio: false,
        michaeelp: false,
        nzrv: false
      };
    }

    merged[demonKey].thiaguinhio = merged[demonKey].thiaguinhio || !!item.thiaguinhio;
    merged[demonKey].michaeelp = merged[demonKey].michaeelp || !!item.michaeelp;
    merged[demonKey].nzrv = merged[demonKey].nzrv || !!item.nzrv;
  }

  // si ya está limpio, no hace nada
  const mergedCount = Object.keys(merged).length;
  if (mergedCount === keys.length) return;

  // borra todo y reescribe limpio
  await db.ref("pasados").remove();
  await db.ref("pasados").set(merged);

  console.log("Duplicados limpiados automáticamente:", keys.length, "→", mergedCount);
}

  loadSpreadsheet();
  autoCleanDuplicates().then(() => listenDB());
  listenDB();
</script>
</body>
</html>
