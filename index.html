<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Cucumberlist</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Geometry Dash palette */
    --yellow:#ffd400;
    --cyan:#4fd1ff;
    --green:#3cff8f;

    --bg:#070b14;
    --card:#0f1629;
    --text:#e5e7eb;
    --sub:#9ca3af;
    --line:#1f2a44;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
  }

  body{
    font-family:'Poppins',sans-serif;
    background:
      linear-gradient(135deg, rgba(255,212,0,0.05), rgba(79,209,255,0.05), rgba(60,255,143,0.05)),
      var(--bg);
    color:var(--text);
  }

  tbody tr:hover{
  background: rgba(255,255,255,0.04);
  }

  .container{
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:30px;
  }

  .header{
    margin-bottom:20px;
  }

  .header h1{
    font-size:30px;
    letter-spacing:1px;
    text-shadow:
  0 0 10px rgba(255,212,0,0.35),
  0 0 20px rgba(79,209,255,0.15);
  }

  .header p{
    color:var(--sub);
  }

  .grid{
    flex:1;
    display:grid;
    grid-template-columns: 1.3fr 0.7fr;
    gap:20px;
  }

  .card{
    background:var(--card);
    border:2px solid var(--line);
    clip-path: polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    padding:20px;
    display:flex;
    flex-direction:column;
  }

  .card h2{
    margin-bottom:14px;
    font-size:18px;
  }

  .form{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    position:relative;
  }

  .form select, .form input{
    padding:12px 14px;
    border:2px solid var(--line);
    background:#0b1022;
    color:var(--text);
    outline:none;
    flex:1;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }

  .form button{
    padding:12px 18px;
    border:none;
    background:linear-gradient(90deg,var(--yellow),var(--cyan));
    color:#000;
    font-weight:700;
    cursor:pointer;
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }

  /* custom search results */
  .search-results{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    max-height:320px;
    overflow-y:auto;
    background:#0b1022;
    border:2px solid var(--line);
    z-index:10;
  }

  .search-item{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:14px;
  }

  .search-item:hover{
    background:rgba(255,255,255,0.05);
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:16px;
    font-size:14px;
  }

  th, td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
  }

  th{
    color:var(--sub);
    font-weight:600;
  }

  .tier{ color:var(--yellow); font-weight:700; }
  .rating{ color:var(--cyan); }
  .points{ color:var(--green); }

  .score-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .player-card{
    padding:14px;
    border:2px solid var(--line);
    background:#0b1022;
    cursor:pointer;
    clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }

  .player-card .name{ font-weight:700; }
  .player-card .score{ color:var(--sub); font-size:14px; }

  @media (max-width: 900px){
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>GD Cucumberlist</h1>
  </div>

  <div class="grid">
    <!-- LISTA -->
    <div class="card">
      <h2>Lista de demons pasados</h2>

      <div class="form">
        <select id="playerSelect">
          <option value="thiaguinhio">thiaguinhio</option>
          <option value="michaeelp">michaeelp</option>
          <option value="nzrv">nzrv</option>
        </select>

        <input id="demonInput" placeholder="Buscar demon…" autocomplete="off">
        <div class="search-results" id="searchResults" style="display:none;"></div>

        <button id="submitBtn">Submit</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Tier</th>
            <th>Demon</th>
            <th>Puntos</th>
            <th>Rating</th>
            <th>Completado</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- PUNTAJES -->
    <div class="card">
      <h2>Puntajes</h2>
      <div class="score-list" id="scoreList"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { 
    apiKey: "AIzaSyBfw2hIsXKxU3z7d11pa2uPVFPfRQcyQe4", 
    authDomain: "gd-cucumberlist.firebaseapp.com", 
    databaseURL: "https://gd-cucumberlist-default-rtdb.firebaseio.com", 
    projectId: "gd-cucumberlist", 
    storageBucket: "gd-cucumberlist.firebasestorage.app", 
    messagingSenderId: "243319547284", 
    appId: "1:243319547284:web:d6100b0f2177b3ebab5b81" 
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const playerSelect = document.getElementById("playerSelect");
  const demonInput = document.getElementById("demonInput");
  const submitBtn = document.getElementById("submitBtn");
  const tableBody = document.getElementById("tableBody");
  const scoreList = document.getElementById("scoreList");
  const searchResults = document.getElementById("searchResults");

  const players = ["thiaguinhio", "michaeelp", "nzrv"];
  let demons = [];
  let selectedDemon = null;

  async function loadSpreadsheet() {
    const url = "https://docs.google.com/spreadsheets/d/1qKlWKpDkOpU1ZF6V6xGfutDY2NvcA8MNPnsv6GBkKPQ/gviz/tq?tqx=out:json&gid=0";
    const res = await fetch(url);
    const text = await res.text();
    const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/s)[1];
    const json = JSON.parse(jsonText);

    demons = json.table.rows
      .map(r => ({
        name: r.c[1]?.v,
        difficulty: r.c[4]?.v,
        tier: Math.floor(Number(r.c[5]?.v) * 10) / 10
      }))
      .filter(d => d.name && !isNaN(d.tier))
      .sort((a,b) => b.tier - a.tier);
  }

  demonInput.addEventListener("input", () => {
    const q = demonInput.value.toLowerCase();
    searchResults.innerHTML = "";

    if (!q) {
      searchResults.style.display = "none";
      return;
    }

    demons.filter(d => d.name.toLowerCase().includes(q)).forEach(d => {
      const div = document.createElement("div");
      div.className = "search-item";
      div.innerText = `${d.tier.toFixed(1)} — ${d.name}`;
      div.onclick = () => {
        selectedDemon = d;
        demonInput.value = `${d.tier.toFixed(1)} — ${d.name}`;
        searchResults.style.display = "none";
      };
      searchResults.appendChild(div);
    });

    searchResults.style.display = "block";
  });

  function listenDB() {
    db.ref("pasados").on("value", snap => {
      const data = snap.val() || {};
      renderTable(data);
      renderScores(data);
    });
  }

  function renderTable(data) {
    const arr = Object.values(data).sort((a,b)=>b.tier-a.tier);
    tableBody.innerHTML = "";

    arr.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
      <td class="tier">${item.tier.toFixed(1)}</td>
      <td>${item.name}</td>
      <td class="points">${item.tier*10}</td>
      <td class="rating">${item.difficulty}</td>
      <td>
        ${players.map(p => `
          <span style="margin-right:10px;color:${item[p] ? 'var(--green)' : '#555'}">
            ${item[p] ? '✓' : '○'} ${p}
          </span>
        `).join("")}
      </td>
      `;
      tableBody.appendChild(tr);
    });
  }

  function calcScore(tier){ return tier*10; }

  function renderScores(data){
    const scoreObj = { thiaguinhio:0, michaeelp:0, nzrv:0 };
    Object.values(data).forEach(d=>{
      players.forEach(p=>{ if(d[p]) scoreObj[p]+=calcScore(d.tier); });
    });

    scoreList.innerHTML = "";
    players.sort((a,b)=>scoreObj[b]-scoreObj[a]).forEach(p=>{
      const div = document.createElement("div");
      div.className = "player-card";
      div.innerHTML = `<div class="name">${p}</div><div class="score">${scoreObj[p]} pts</div>`;
      scoreList.appendChild(div);
    });
  }

  submitBtn.addEventListener("click", async ()=>{
    if(!selectedDemon) return alert("Seleccioná un demon de la lista");
    const player = playerSelect.value;

    await db.ref("pasados").push({
      tier: selectedDemon.tier,
      name: selectedDemon.name,
      difficulty: selectedDemon.difficulty,
      thiaguinhio: player==="thiaguinhio",
      michaeelp: player==="michaeelp",
      nzrv: player==="nzrv"
    });

    demonInput.value="";
    selectedDemon=null;
  });

  loadSpreadsheet();
  listenDB();
</script>
</body>
</html>
